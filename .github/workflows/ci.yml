name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lua syntax (Ikemen GO's gopher-lua is Lua 5.1)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          luac5.1 -p external/mods/woo_brain.lua
          luac5.1 -p tests/fixtures/*.lua
          lua5.1 tests/test_brain.lua

      - name: Python syntax and lint (tools and tests)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements-ci.txt
          python3 -m compileall -q woo/tools tests
          .venv/bin/ruff check --select E9,F63,F7,F82 woo/tools tests

      - name: Repository checks (version, BETA notice, privacy, links, data files)
        run: python3 -m unittest discover -s tests -v

      - name: Patch applies to stock Ikemen GO v1.0.0
        run: |
          mkdir -p /tmp/stock/external/script
          curl -fsSL https://raw.githubusercontent.com/ikemen-engine/Ikemen-GO/v1.0.0/external/script/start.lua \
            -o /tmp/stock/external/script/start.lua
          cd /tmp/stock
          patch -p0 --dry-run < "$GITHUB_WORKSPACE/patches/start-lua-palette-default.patch"
