name: Bug report (BETA)
description: Something looked wrong, stalled or crashed. This project is BETA, so reports are welcome and expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing a BETA. The more of `woo/logs/brain.log` you can attach, the faster this can be fixed.
        Try the same match with `-woo off` first: it tells us whether the brain is involved.
  - type: input
    id: version
    attributes:
      label: Brain version
      description: The first line of woo/logs/brain.log, e.g. "woo_brain 0.9.0-beta.1 (BETA) loaded".
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Which characters, which mode (Watch, team size), what you saw, what you expected.
    validations:
      required: true
  - type: dropdown
    id: without
    attributes:
      label: Does it also happen with `-woo off`?
      options: [Yes, No, Did not try]
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant lines from woo/logs/brain.log
      render: text
  - type: input
    id: env
    attributes:
      label: Setup
      description: Windows version, Ikemen GO version, roster size (own roster? the author's? a few characters?).
