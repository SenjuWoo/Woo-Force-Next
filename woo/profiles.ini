; Woo Force brain - character knowledge rules.
; Read by woo/tools/roster_analyzer.py. Re-run the analyzer after editing.
;
; Matching: words are matched against "<folder> <name> <displayname>" as whole words,
; case-insensitive, punctuation ignored. A trailing * matches a prefix (ssj* = ssj4, ssj3...).
; First matching [persona.*] section wins, so specific characters come before broad ones.
; Highest matching [tier.*] wins.
;
; Personas (behaviour lives in external/mods/woo_brain.lua):
;   effortless  overwhelming calm: walks in, near-perfect guard, punishes, taunts, never panics
;   tactician   patient and precise: spacing, counters, punishes, efficient supers
;   zoner       keeps distance, projectiles, anti-airs, retreats from rushdown
;   rushdown    fast, relentless pressure, dash-ins, long combos
;   warrior     proud and direct: aggressive, honorable, taunts when ahead, finishes with supers
;   berserker   all-in pressure, rarely guards, spends meter the moment it has it
;   trickster   jumps, crossups, feints, unpredictable timing
;   brawler     balanced default
;
; [override.<folder name>] sets tier/persona/mode/series for one character.
; mode = coach keeps the character's own AI; mode = pilot lets the brain drive it.

[analyzer]
; A character's own AI counts as "strong" (kept; the brain only coaches it) when it has at
; least strong_ai_ctrls AI ChangeStates in states -1/-2/-3, at least this share of them read
; the situation (p2movetype, inguarddist, p2stateno, edges...), at least strong_combo_ctrls
; chain on movehit/movecontact, and it guards at all. Everything else is piloted by the brain.
strong_ai_ctrls = 12
strong_situational_share = 0.4
strong_combo_ctrls = 3

